<meta property="og:image:width" content="{{ page.og_image_width | default: '1200' }}" />
<meta property="og:image:height" content="{{ page.og_image_height | default: '630' }}" />
<meta property="og:image:alt" content="{{ page.og_image_alt | default: 'Yoosuf Mohamed — Systems Architect. AI Automation & AI-First Products.' }}" />
<meta property="fb:app_id" content="313140939486083" />
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
<meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}" />
<meta property="article:author" content="{{ site.url }}/about/" />
{% if page.categories.size > 0 %}<meta property="article:section" content="{{ page.categories | first }}" />{% endif %}
{% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}" />{% endfor %}
{% endif %}
